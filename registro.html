<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Perfumes</title>

    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.js"></script>

<style>

    body{
        margin: 0px;
        padding: 0px;
        font-family: Arial, Helvetica, sans-serif;

        width: 100%;
        height: 900px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(
            135deg,
            #000000,
            #1a1a1a,
            #2f2f2f,
            #111111
        );
    }

    .contenedor{

        width: 420px;

        padding: 35px;

        border-radius: 20px;

        background-color: rgba(20,20,20,0.95);

        border: 2px solid #444;

        box-shadow:
            0px 0px 20px rgba(255,0,0,0.3),
            0px 0px 40px rgba(0,0,0,0.8);

        animation: aparecer 1.2s ease;
    }

    @keyframes aparecer{

        0%{
            opacity: 0;
            transform: translateY(-60px) scale(0.8);
        }

        50%{
            opacity: 0.5;
            transform: translateY(20px) scale(1.03);
        }

        100%{
            opacity: 1;
            transform: translateY(0px) scale(1);
        }
    }

    h2{

        text-align: center;

        color: red;

        margin-bottom: 30px;

        letter-spacing: 2px;

        text-shadow: 0px 0px 10px red;
    }

    label{

        color: #ff2b2b;

        font-size: 15px;

        font-weight: bold;

        letter-spacing: 1px;
    }

    input{

        width: 100%;

        padding: 12px;

        margin-top: 6px;
        margin-bottom: 18px;

        border-radius: 10px;

        border: 1px solid #555;

        background-color: #1f1f1f;

        color: white;

        outline: none;

        transition: 0.3s;
    }

    input::placeholder{

        color: #999;
    }

    input:focus{

        border: 1px solid red;

        box-shadow: 0px 0px 12px red;

        transform: scale(1.02);
    }

    button{

        width: 100%;

        padding: 12px;

        border: none;

        border-radius: 10px;

        background-color: red;

        color: white;

        font-size: 15px;

        font-weight: bold;

        cursor: pointer;

        transition: 0.3s;
    }

    button:hover{

        background-color: #ff3d3d;

        box-shadow: 0px 0px 15px red;

        transform: translateY(-3px);
    }

    .error{

        color: #ff4d4d;

        font-size: 13px;

        margin-top: -10px;
        margin-bottom: 10px;

        display: none;

        text-shadow: 0px 0px 5px red;
    }

</style>
</head>
<body>

<div class="contenedor">

    <h2>Registro de Perfumes</h2>

    <form id="formulario" action="" method="POST">

        <label>Código</label>
        <input type="text" name="codigo" id="codigo">
        <div class="error" id="errorCodigo">Ingrese el código</div>

        <label>Nombre</label>
        <input type="text" name="nombre" id="nombre">
        <div class="error" id="errorNombre">Ingrese el nombre</div>

        <label>Descripción</label>
        <input type="text" name="descripcion" id="descripcion">
        <div class="error" id="errorDescripcion">Ingrese la descripción</div>

        <label>Precio</label>
        <input type="number" name="precio" id="precio">
        <div class="error" id="errorPrecio">Ingrese el precio</div>

        <label>Costo</label>
        <input type="number" name="costo" id="costo">
        <div class="error" id="errorCosto">Ingrese el costo</div>

        <label>Stock</label>
        <input type="number" name="stock" id="stock">
        <div class="error" id="errorStock">Ingrese el stock</div>

        <button type="submit">Guardar Perfume</button>

    </form>

</div>

<script>
$(document).ready(function () {

    $("#formulario").validate({

        rules: {
            codigo: {
                required: true,
                minlength: 2
            },
            nombre: {
                required: true,
                minlength: 3
            },
            descripcion: {
                required: true,
                minlength: 5
            },
            precio: {
                required: true,
                number: true,
                min: 1
            },
            costo: {
                required: true,
                number: true,
                min: 1
            },
            stock: {
                required: true,
                digits: true,
                min: 0
            }
        },

        messages: {
            codigo: {
                required: "Ingrese el código",
                minlength: "Mínimo 2 caracteres"
            },
            nombre: {
                required: "Ingrese el nombre",
                minlength: "Mínimo 3 caracteres"
            },
            descripcion: {
                required: "Ingrese la descripción",
                minlength: "Mínimo 5 caracteres"
            },
            precio: {
                required: "Ingrese el precio",
                number: "Solo números",
                min: "Debe ser mayor a 0"
            },
            costo: {
                required: "Ingrese el costo",
                number: "Solo números",
                min: "Debe ser mayor a 0"
            },
            stock: {
                required: "Ingrese el stock",
                digits: "Solo números enteros",
                min: "No puede ser negativo"
            }
        },

        errorPlacement: function (error, element) {
            error.insertAfter(element);
        },

        submitHandler: function (form) {
            form.submit();
        }

    });

});
</script>
</body>
</html>
